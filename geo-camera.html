<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>定位相機</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000; --fg: #f2f2f2; --muted: #9a9a9a; --stamp: #e5482f; --ok: #34c759; --warn: #ffcc00;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; overflow: hidden; }
  .app { position: relative; height: 100%; display: flex; flex-direction: column; }
  .viewer { position: relative; flex: 1; overflow: hidden; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.on { animation: flash .25s ease-out; }
  @keyframes flash { from { opacity: .7 } to { opacity: 0 } }

  /* 浮水印預覽：橫拿手機時整塊轉 90 度，讓你看到它會在照片的哪個角落 */
  .frame { position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
    transform: translate(-50%, -50%); pointer-events: none; }
  .frame.cw  { width: var(--vh); height: var(--vw); transform: translate(-50%, -50%) rotate(90deg); }
  .frame.ccw { width: var(--vh); height: var(--vw); transform: translate(-50%, -50%) rotate(-90deg); }
  .stamp { position: absolute; left: 4px; bottom: 4px; color: var(--stamp);
    font: 600 clamp(15px, 4.6vw, 22px)/1.3 -apple-system, "PingFang TC", sans-serif; white-space: pre; }

  .gps { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.55); font-size: 13px; white-space: nowrap; }
  .gps .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px;
    background: var(--warn); vertical-align: 1px; }
  .gps.ok .dot { background: var(--ok); }

  .msg { position: absolute; inset: 0; display: none; place-items: center; text-align: center;
    padding: 2rem; color: var(--muted); line-height: 1.6; }
  .toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    background: rgba(0,0,0,.75); color: #fff; padding: 10px 16px; border-radius: 10px;
    font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }

  .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 16px 24px 20px; }
  .count { font-size: 14px; color: var(--muted); }
  .shutter { width: 74px; height: 74px; border-radius: 50%; border: 4px solid #fff;
    background: #fff; background-clip: content-box; padding: 4px; cursor: pointer; }
  .shutter:active { transform: scale(.93); }
  .shutter:disabled { opacity: .4; }
  .start { position: absolute; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.7); }
  .start button { border: 0; border-radius: 999px; padding: 14px 28px; font: 600 17px/1 inherit;
    font-family: inherit; background: var(--stamp); color: #fff; }
  button:focus-visible { outline: 3px solid var(--stamp); outline-offset: 2px; }
  canvas { display: none; }
</style>
</head>
<body>
<div class="app">
  <div class="viewer" id="viewer">
    <video id="video" playsinline autoplay muted></video>
    <div id="frame" class="frame"><div id="stamp" class="stamp"></div></div>
    <div id="gps" class="gps"><span class="dot"></span><span id="gpsText">定位中…</span></div>
    <div id="flash" class="flash"></div>
    <div id="msg" class="msg"></div>
    <div id="toast" class="toast"></div>
    <div id="start" class="start"><button id="startBtn">開始拍照</button></div>
  </div>
  <div class="bar">
    <span id="count" class="count"></span>
    <button id="shutter" class="shutter" aria-label="拍照"></button>
    <span></span>
  </div>
</div>
<canvas id="canvas"></canvas>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('canvas');
const params = new URLSearchParams(location.search);
const FLIP = params.has('flip');   // 橫拍浮水印跑錯角落時，在網址加上 ?flip
const COLOR = '#e5482f';
const SIZE = 0.045;

// ---------- 持續定位 ----------
let pos = null; // { lat, lng, acc, t }
function startGPS() {
  if (!navigator.geolocation) { $('gpsText').textContent = '這裡不支援定位'; return; }
  navigator.geolocation.watchPosition(p => {
    pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
  }, err => {
    $('gpsText').textContent = err.code === 1 ? '沒有定位權限' : '定位訊號弱';
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}
setInterval(() => {
  if (!pos) return;
  const age = (Date.now() - pos.t) / 1000;
  $('gps').classList.toggle('ok', age < 5);
  $('gpsText').textContent = age < 5 ? `GPS ±${Math.round(pos.acc)} 公尺` : `位置 ${Math.round(age)} 秒沒更新`;
}, 500);

// ---------- 手機方向（判斷橫拍直拍）----------
let gravity = null;
window.addEventListener('devicemotion', e => { gravity = e.accelerationIncludingGravity; });
// 回傳 'portrait'、'cw'（照片要順時針轉）、'ccw'（逆時針轉）
function deviceTurn() {
  if (!gravity || gravity.x == null) return 'portrait';
  const x = gravity.x, y = gravity.y;
  if (Math.abs(x) < Math.abs(y) + 2) return 'portrait';
  let t = x > 0 ? 'cw' : 'ccw';
  if (FLIP) t = t === 'cw' ? 'ccw' : 'cw';
  return t;
}
const windowLandscape = () => innerWidth > innerHeight;

// ---------- 浮水印文字 ----------
const pad = n => String(n).padStart(2, '0');
function stampLines(d) {
  return [
    '緯度:' + (pos ? pos.lat.toFixed(6) : '定位中'),
    '經度:' + (pos ? pos.lng.toFixed(6) : '定位中'),
    '時間:' + `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`,
  ];
}
function updatePreview() {
  $('stamp').textContent = stampLines(new Date()).join('\n');
  const v = $('viewer');
  $('frame').style.setProperty('--vw', v.clientWidth + 'px');
  $('frame').style.setProperty('--vh', v.clientHeight + 'px');
  const turn = windowLandscape() ? 'portrait' : deviceTurn();
  $('frame').className = 'frame' + (turn === 'portrait' ? '' : ' ' + turn);
}
setInterval(updatePreview, 200);

// ---------- 相機 ----------
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 4032 }, height: { ideal: 3024 } }, audio: false });
    video.srcObject = stream;
  } catch (e) {
    $('msg').style.display = 'grid';
    $('msg').textContent = '相機打不開（' + (e.name || e) + '）。這個環境可能不允許網頁使用相機。';
  }
}

// ---------- 拍照 ----------
function capture() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return null;
  const frameLandscape = vw > vh;
  const turn = deviceTurn();
  const wantLandscape = turn !== 'portrait' || windowLandscape();
  let rotate = null;
  if (wantLandscape !== frameLandscape) rotate = turn === 'portrait' ? 'cw' : turn;

  const w = rotate ? vh : vw, h = rotate ? vw : vh;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.save();
  if (rotate === 'cw') { ctx.translate(w, 0); ctx.rotate(Math.PI / 2); }
  if (rotate === 'ccw') { ctx.translate(0, h); ctx.rotate(-Math.PI / 2); }
  ctx.drawImage(video, 0, 0, vw, vh);
  ctx.restore();

  const lines = stampLines(new Date());
  const size = Math.round(Math.min(w, h) * SIZE);
  const lineH = Math.round(size * 1.3);
  const left = Math.round(size * 0.15), bottom = Math.round(size * 0.2);
  ctx.font = `600 ${size}px -apple-system, "PingFang TC", sans-serif`;
  ctx.fillStyle = COLOR; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  const startY = h - bottom - lineH * lines.length;
  lines.forEach((t, i) => ctx.fillText(t, left, startY + i * lineH + (lineH - size) / 2));
  return canvas.toDataURL('image/jpeg', 0.92);
}

// ---------- 交給 Scriptable 存相簿 ----------
let inScriptable = false, pendingCb = null, saved = 0;
const queue = [];
window.__scRegister = cb => {
  inScriptable = true;
  if (queue.length) cb(queue.shift()); else pendingCb = cb;
};
window.__scSaved = n => { saved = n; $('count').textContent = `已存 ${n} 張`; toast('已存入相簿'); };
window.__scError = m => toast('存檔失敗：' + m);
function deliver(dataUrl) {
  if (pendingCb) { const c = pendingCb; pendingCb = null; c(dataUrl); } else queue.push(dataUrl);
}

async function shareSingle(dataUrl) {
  const blob = await (await fetch(dataUrl)).blob();
  const file = new File([blob], `IMG_${Date.now()}.jpg`, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch (e) {}
  }
}

let toastTimer;
function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
}

$('shutter').onclick = () => {
  if (!pos) { toast('還在定位，請稍等'); return; }
  const data = capture(); if (!data) return;
  $('flash').classList.remove('on'); void $('flash').offsetWidth; $('flash').classList.add('on');
  if (inScriptable) deliver(data); else shareSingle(data);
};

// iOS 要使用者點一下才能讀取手機方向
async function begin() {
  $('start').style.display = 'none';
  try { if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission) await DeviceMotionEvent.requestPermission(); } catch (e) {}
  startGPS(); startCamera();
}
if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
  $('start').style.display = 'grid';
  $('startBtn').onclick = begin;
} else {
  begin();
}
</script>
</body>
</html>
